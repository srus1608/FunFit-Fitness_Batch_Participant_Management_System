<!doctype html>
<html>
<head><meta charset="utf-8"><title>Update Participant</title></head>
<body>
<h2>Update Participant</h2>
<form id="updForm">
  <label>Participant ID: <input name="id" required></label><br>
  <label>Name: <input name="name"></label><br>
  <label>Age: <input name="age" type="number"></label><br>
  <label>Phone: <input name="phone"></label><br>
  <label>Email: <input name="email"></label><br>
  <label>Batch ID: <input name="batch_id" type="number"></label><br>
  <button type="submit">Update</button>
</form>

<script>
document.getElementById('updForm').addEventListener('submit', function(e){
  e.preventDefault();
  const form = new FormData(e.target);
  const params = new URLSearchParams();
  for (const [k,v] of form.entries()) if (v) params.append(k,v);
  const id = form.get('id');
  fetch('participants?id='+encodeURIComponent(id), {
    method: 'PUT',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: params.toString()
  }).then(r => {
    if (r.ok || r.status === 204) alert('Updated'); else alert('Update failed');
  }).catch(err => alert('Error: '+err));
});
</script>
</body>
</html>
